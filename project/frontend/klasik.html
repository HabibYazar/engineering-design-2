<!-- KLASİK GÖRÜNÜM. Yeni yönetim arayüzü index.html'dedir; bu sayfa
     gezinme haritası (graph.js) tabanlı önceki kabuğu korur ve yeni
     kabuktaki "Klasik Görünüm" bağlantısından açılır. -->
<!-- Tek sayfa uygulaması: kabuk ve tüm ekranlar JavaScript ile çizilir.
     YÜKLEME SIRASI ÖNEMLİDİR:
       api.js           backend istemcisi, biçimlendirme, durum bileşenleri
       themes.js        fakülte temaları (palet, doku, şekil, tipografi)
       graph.js         gezinme haritası (SVG hub grafiği)
       data-adapter.js  gezinme ağacı — GERÇEK API'den kurulur
       ui-kit.js        yeni tasarımın bileşen sözlüğü (kutu/kart/çubuk/halka)
       lenses.js        hub içerikleri — yeni görsel dilde, gerçek API verisiyle
       hubs.js          8 hub ve içlerindeki alt modüller
       app.js           kabuk, yönlendirme, asistan kabuğu, grafik yardımcıları
       ai-view-renderer.js  dinamik AI paneli (ui_spec 2.0) — DEĞİŞMEDİ
       views-planning / views-system  HENÜZ TAŞINMAMIŞ ekranlar (senaryo,
                        yapı, veri aktarımı, kullanıcı) — geçici köprü
       views-assistant  yalnızca SOHBET MOTORU için yüklenir; ekran çizimi
                        artık `lenses.js` içindeki asistan merceğidir
     Harici kütüphane veya CDN kullanılmaz, derleme adımı yoktur.
     (?v= parametresi tarayıcı önbelleğini tazeler) -->
